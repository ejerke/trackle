# Continuous integration: every push to master and every pull request must
# install cleanly from the lockfile, typecheck, pass all tests and build.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # keep in sync with mise.toml and the server
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (no silent upgrades)
      # and runs only the install scripts allowed in package.json (better-sqlite3).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Continuous deployment: a commit on master that passed every check above is
  # pushed to the `production` branch. The server polls that branch and deploys
  # it (deploy/trackle-deploy.timer), so GitHub never needs access to the server.
  promote:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No --force: production only ever moves forward along master. To keep
      # the server on an older commit, use `deploy.sh <commit>` there, which
      # pauses automatic deploys (docs/deployment.md#rolling-back).
      - run: git push origin HEAD:refs/heads/production
